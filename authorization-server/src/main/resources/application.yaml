server:
  port: 9000
  servlet:
    session:
      timeout: 12h
      cookie:
        name: SESSION_AUTH
        same-site: lax

spring:
  application:
    name: authorization-server

  sql:
    init:
      mode: always

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000
        client:
          bff-client:
            registration:
              client-id: "bff-client-id"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              redirect-uris:
                - "http://localhost:8080/login/oauth2/code/bff-client"
              post-logout-redirect-uris:
                - "http://localhost:5173"
              scopes:
                - "openid"
                - "profile"
                - "message:read"
                - "message:write"
            require-authorization-consent: true

app:
  access-token-audience: http://localhost:8090

management:
  endpoints:
    web:
      exposure:
        include: health

