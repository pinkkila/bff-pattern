server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION_BFF
        same-site: strict

spring:
  application:
    name: bff

  security:
    oauth2:
      client:
        registration:
          bff-client:
            provider: authorization-server
            client-id: bff-client-id
            client-secret: secret
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
            scope: openid, profile, message:read, message:write
            client-name: "BFF Pattern Application"
        provider:
          authorization-server:
            issuer-uri: ${app.authorization-server-uri}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # The browser's cookies stay at the BFF. Downstream services get only the access token.
            - id: userinfo
              uri: ${app.authorization-server-uri}
              predicates:
                - Path=/userinfo
              filters:
                - RemoveRequestHeader=Cookie
                - TokenRelay=
            - id: resource-server
              uri: ${app.resource-server-uri}
              predicates:
                - Path=/api/**
              filters:
                - RemoveRequestHeader=Cookie
                - StripPrefix=1
                - TokenRelay=

app:
  base-uri: http://localhost:5173
  authorization-server-uri: http://localhost:9000
  resource-server-uri: http://localhost:8090

management:
  endpoints:
    web:
      exposure:
        include: health

