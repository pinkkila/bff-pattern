server:
  port: 8090

spring:
  application:
    name: resource-server

  data:
    web:
      pageable:
        serialization-mode: via_dto

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          # Tokens are rejected unless "iss" is exactly this value. With jwk-set-uri also set, the signing keys still
          # come from jwk-set-uri, so the authorization server doesn't have to be running at startup.
          issuer-uri: http://localhost:9000
          # Tokens are rejected unless "aud" contains this value (RFC 9700, section 2.3)
          audiences: http://localhost:8090

  web:
    resources:
      add-mappings: false

#  Is this working if web.resources.add-mappings is false?
#  mvc:
#    problemdetails:
#      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

